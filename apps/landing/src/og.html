<!doctype html>
<!-- Template for assets/og-{en,pl}.jpg (1200×630): build.mjs doesn't render it;
     render with: npx playwright screenshot --viewport-size=1200,630 "src/og.html?lang=pl" -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        background: radial-gradient(900px 500px at 85% 40%, #0f2a1d 0%, #0a0e14 60%);
        color: #c9d4e3;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: grid;
        grid-template-columns: 1fr 330px;
        gap: 48px;
        padding: 64px 72px;
        box-sizing: border-box;
      }
      .logo {
        font:
          700 30px ui-monospace,
          Menlo,
          monospace;
        color: #e6edf6;
      }
      .logo b {
        color: #39ff88;
      }
      h1 {
        margin: 44px 0 0;
        font-size: 62px;
        line-height: 1.08;
        letter-spacing: -0.02em;
        color: #e6edf6;
      }
      .chips {
        display: flex;
        gap: 12px;
        margin-top: 40px;
        flex-wrap: wrap;
      }
      .chip {
        font:
          600 20px ui-monospace,
          Menlo,
          monospace;
        color: #39ff88;
        border: 1px solid #1c2633;
        background: #0f1620;
        border-radius: 999px;
        padding: 10px 18px;
      }
      .phone {
        align-self: center;
        border-radius: 34px;
        border: 2px solid #1c2633;
        overflow: hidden;
        height: 600px;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
      }
      .phone img {
        width: 100%;
        display: block;
        margin-top: -170px;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="logo"><b>&gt;</b> opencollab<b>_</b></div>
      <h1 id="h1"></h1>
      <div class="chips" id="chips"></div>
    </div>
    <div class="phone"><img id="shot" alt="" /></div>
    <script>
      const lang = new URLSearchParams(location.search).get('lang') || 'en'
      document.getElementById('shot').src = `../assets/screens/feed-${lang}.webp`
      const text = {
        en: [
          'Private boards for you, your friends and your agents.',
          ['End-to-end encrypted', 'No server', 'No account']
        ],
        pl: [
          'Prywatne tablice dla ciebie, znajomych i twoich agentów.',
          ['Szyfrowanie end-to-end', 'Bez serwera', 'Bez konta']
        ]
      }[lang]
      document.getElementById('h1').textContent = text[0]
      document.getElementById('chips').innerHTML = text[1]
        .map((c) => `<span class="chip">${c}</span>`)
        .join('')
    </script>
  </body>
</html>
