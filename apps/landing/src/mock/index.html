<!doctype html>
<!--
  Phone mockups of the OpenCollab app for the landing page: screenshots and
  short clips. Not shipped; render with apps/landing/src/mock/render.mjs.

    index.html?scene=feed|slides|chores|game|app|chat|desktop&lang=en|pl

  `desktop` is the same Weekend reading board on a laptop (1600×1000).

  Animations are Web Animations created paused; the renderer sets every
  animation's currentTime frame by frame, so clips are smooth and repeatable.
  Photos: GPT Image 2.5 (treg), generated for these mockups.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=390" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 390px;
        height: 844px;
        overflow: hidden;
        font-family:
          'Roboto',
          -apple-system,
          'Segoe UI',
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      body {
        background: var(--bg);
        color: var(--text);
        position: relative;
      }
      .status {
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 22px 0 26px;
        font:
          600 14px/1 -apple-system,
          sans-serif;
        color: var(--text);
      }
      .status .sys {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .status i {
        display: inline-block;
        background: var(--text);
        border-radius: 2px;
      }
      .screen {
        padding: 6px 16px 0;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
      }
      .top h1 {
        flex: 1;
        margin: 0;
        font-size: 22px;
        font-weight: 800;
        color: var(--text);
        letter-spacing: -0.01em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 34px;
        padding: 0 12px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--surface);
        font-size: 13px;
        font-weight: 700;
        color: var(--text);
        white-space: nowrap;
      }
      .pill.accent {
        border-color: var(--accent);
        color: var(--accent);
      }
      .pill.filled {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--ink);
      }
      .ico {
        width: 15px;
        height: 15px;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .av {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font:
          700 11px/1 -apple-system,
          sans-serif;
        color: #fff;
        flex: none;
      }
      .av.big {
        width: 30px;
        height: 30px;
        font-size: 13px;
      }
      .online span:last-child {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }
      .online {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 26px;
        font-size: 13px;
        color: var(--muted);
      }
      .stack {
        display: flex;
      }
      .stack .av {
        margin-right: -6px;
        border: 2px solid var(--bg);
        width: 24px;
        height: 24px;
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        margin-left: 8px;
      }
      .spin {
        width: 13px;
        height: 13px;
        border-radius: 50%;
        border: 2px solid var(--border);
        border-top-color: var(--accent);
        flex: none;
      }
      .desc {
        font-size: 13px;
        color: var(--muted);
        margin: 2px 0 12px;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
      }
      /* Desktop (scene=desktop): 1600×1000 */
      body.desktop {
        width: 1600px;
        height: 1000px;
        display: grid;
        grid-template-columns: 1fr 380px;
        font-size: 15px;
      }
      .dmain {
        padding: 28px 40px;
        min-width: 0;
      }
      .dtop {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 4px;
      }
      .dtop h1 {
        margin: 0;
        font-size: 30px;
        font-weight: 800;
        letter-spacing: -0.01em;
      }
      .dtop .tabs {
        display: flex;
        gap: 4px;
        margin-left: 18px;
      }
      .dtop .tabs span {
        padding: 7px 12px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        color: var(--muted);
      }
      .dtop .tabs span.on {
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--border);
      }
      .dtop .right {
        margin-left: auto;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .dgrid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin-top: 18px;
      }
      .dgrid .post {
        margin: 0;
      }
      .dgrid .post img {
        height: 190px;
      }
      .dcover {
        height: 190px;
        display: flex;
        align-items: flex-end;
        padding: 16px;
        font-size: 20px;
        font-weight: 800;
        line-height: 1.15;
        color: #fff;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.45);
      }
      .dchat {
        border-left: 1px solid var(--border);
        background: var(--surface);
        padding: 24px 22px;
        display: flex;
        flex-direction: column;
      }
      .dchat h2 {
        margin: 0 0 4px;
        font-size: 18px;
      }
      .dchat .sub {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 22px;
      }
      .dchat .msgs {
        flex: 1;
      }
      .dchat .composer {
        position: static;
        margin-top: auto;
      }
      /* Feed */
      .keypoints {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px;
        border-radius: 14px;
        background: var(--accent);
        color: var(--ink);
        margin-bottom: 12px;
      }
      .keypoints .ic {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.28);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .keypoints b {
        display: block;
        font-size: 15px;
      }
      .keypoints span {
        font-size: 12px;
        opacity: 0.85;
      }
      .post {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        overflow: hidden;
        margin-bottom: 12px;
      }
      .post .who {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        font-size: 14px;
        font-weight: 600;
      }
      .post .who small {
        color: var(--muted);
        font-weight: 400;
        font-size: 12px;
      }
      .post img {
        display: block;
        width: 100%;
        height: 196px;
        object-fit: cover;
      }
      .post .text {
        padding: 10px 12px 12px;
      }
      .post h3 {
        margin: 0 0 4px;
        font-size: 15px;
        color: var(--text);
      }
      .post p {
        margin: 0;
        font-size: 13px;
        line-height: 1.45;
        color: var(--muted);
      }
      .post .src {
        display: flex;
        align-items: center;
        gap: 5px;
        margin-top: 8px;
        font-size: 12px;
        font-weight: 600;
        color: var(--accent);
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin: 0 12px 8px;
        padding: 3px 9px 3px 6px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--bg);
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
      }
      /* Slides */
      .player {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: #000;
        color: #fff;
      }
      .player .bg {
        position: absolute;
        inset: -30px;
        background-size: cover;
        background-position: center;
        filter: blur(26px) saturate(1.2);
        transform: scale(1.1);
      }
      .player .shade {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.55),
          rgba(0, 0, 0, 0.3) 40%,
          rgba(0, 0, 0, 0.72)
        );
      }
      .bars {
        position: absolute;
        top: 46px;
        left: 12px;
        right: 12px;
        display: flex;
        gap: 4px;
      }
      .bars span {
        flex: 1;
        height: 3px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.3);
        overflow: hidden;
      }
      .bars span i {
        display: block;
        height: 100%;
        background: #fff;
        transform-origin: left;
      }
      .phead {
        position: absolute;
        top: 60px;
        left: 14px;
        right: 14px;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
      }
      .phead .badge {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--accent);
        color: var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
      }
      .phead small {
        display: block;
        opacity: 0.75;
        font-size: 11px;
      }
      .slide {
        position: absolute;
        left: 26px;
        right: 26px;
        top: 230px;
      }
      .slide .label {
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 10px;
      }
      .slide h2 {
        margin: 0 0 18px;
        font-size: 34px;
        line-height: 1.12;
        font-weight: 900;
      }
      .slide p {
        margin: 0 0 14px;
        font-size: 20px;
        line-height: 1.42;
        font-weight: 500;
      }
      .slide p b {
        color: var(--accent);
        font-weight: 800;
      }
      .pbtns {
        position: absolute;
        left: 14px;
        bottom: 34px;
        display: flex;
        gap: 10px;
      }
      .pbtns span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 9px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
        border: 1px solid rgba(255, 255, 255, 0.25);
        font-size: 13px;
        font-weight: 600;
      }
      .tap {
        position: absolute;
        width: 56px;
        height: 56px;
        margin: -28px 0 0 -28px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.35);
        opacity: 0;
        pointer-events: none;
      }
      /* Lists */
      .list {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        overflow: hidden;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 13px 14px;
        border-top: 1px solid var(--border);
        background: var(--surface);
        position: relative;
      }
      .row:first-child {
        border-top: 0;
      }
      .check {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        border: 2px solid var(--muted);
        flex: none;
        position: relative;
      }
      .check .fill {
        position: absolute;
        inset: -2px;
        border-radius: 50%;
        background: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--ink);
        font-size: 14px;
        font-weight: 900;
        opacity: 0;
      }
      .done .check .fill {
        opacity: 1;
      }
      .row .t {
        flex: 1;
        font-size: 15px;
        color: var(--text);
      }
      .row .t small {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-top: 2px;
      }
      .done .t {
        color: var(--muted);
        text-decoration: line-through;
      }
      .due {
        font-size: 11px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--warn) 18%, transparent);
        color: var(--warn);
      }
      .section {
        font:
          600 11px ui-monospace,
          Menlo,
          monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 18px 4px 8px;
      }
      /* Kanban */
      .cols {
        display: flex;
        gap: 12px;
        width: max-content;
      }
      .col {
        min-height: 430px;
        width: 290px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 10px;
      }
      .col h4 {
        display: flex;
        justify-content: space-between;
        margin: 2px 4px 10px;
        font-size: 14px;
        color: var(--text);
      }
      .col h4 span {
        color: var(--muted);
        font:
          500 12px ui-monospace,
          Menlo,
          monospace;
      }
      .card {
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px;
        margin-bottom: 8px;
        position: relative;
      }
      .card img {
        display: block;
        width: calc(100% + 20px);
        margin: -10px -10px 10px;
        height: 110px;
        object-fit: cover;
        border-radius: 12px 12px 0 0;
      }
      .labels {
        display: flex;
        gap: 5px;
        margin-bottom: 6px;
      }
      .lb {
        font-size: 10px;
        font-weight: 800;
        padding: 2px 7px;
        border-radius: 5px;
        color: #111;
      }
      .card .title {
        font-size: 14px;
        font-weight: 600;
        color: var(--text);
        line-height: 1.3;
      }
      .meta span {
        display: inline-flex;
        align-items: center;
        gap: 3px;
      }
      .meta {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
        font-size: 11px;
        color: var(--muted);
      }
      .meta .grow {
        flex: 1;
      }
      .progress {
        height: 4px;
        border-radius: 2px;
        background: var(--border);
        margin-top: 8px;
        overflow: hidden;
      }
      .progress i {
        display: block;
        height: 100%;
        background: var(--accent);
      }
      .pts {
        font:
          700 10px ui-monospace,
          Menlo,
          monospace;
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 1px 5px;
      }
      /* Chat */
      .msg {
        display: flex;
        gap: 10px;
        margin-bottom: 16px;
      }
      .msg .b {
        font-size: 14px;
        line-height: 1.45;
        color: var(--text);
      }
      .msg .n {
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 2px;
      }
      .msg .n small {
        font-weight: 400;
        color: var(--muted);
        margin-left: 6px;
      }
      .agent {
        font:
          700 9px ui-monospace,
          Menlo,
          monospace;
        color: var(--accent);
        border: 1px solid var(--accent);
        border-radius: 4px;
        padding: 0 4px;
        margin-left: 6px;
        vertical-align: 1px;
      }
      .composer {
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: 26px;
        display: flex;
        gap: 8px;
      }
      .composer .in {
        flex: 1;
        height: 44px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--muted);
        font-size: 14px;
        display: flex;
        align-items: center;
        padding: 0 14px;
      }
      .composer .send {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: var(--accent);
      }
    </style>
  </head>
  <body>
    <script>
      const ICONS = {
        'external-link':
          '<path d="M15 3h6v6" /> <path d="M10 14 21 3" /> <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />',
        filter: '<polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3" />',
        'columns-3':
          '<rect width="18" height="18" x="3" y="3" rx="2" /> <path d="M9 3v18" /> <path d="M15 3v18" />',
        x: '<path d="M18 6 6 18" /> <path d="m6 6 12 12" />',
        'list-checks':
          '<path d="m3 17 2 2 4-4" /> <path d="m3 7 2 2 4-4" /> <path d="M13 6h8" /> <path d="M13 12h8" /> <path d="M13 18h8" />',
        bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" /> <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />',
        send: '<path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z" /> <path d="m21.854 2.147-10.94 10.939" />',
        layers:
          '<path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z" /> <path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65" /> <path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65" />',
        'message-circle': '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z" />',
        ellipsis:
          '<circle cx="12" cy="12" r="1" /> <circle cx="19" cy="12" r="1" /> <circle cx="5" cy="12" r="1" />'
      }
      const ic = (name, size = 15) =>
        `<svg class="ico" viewBox="0 0 24 24" style="width:${size}px;height:${size}px">${ICONS[name]}</svg>`
      const params = new URLSearchParams(location.search)
      const scene = params.get('scene') || 'feed'
      const lang = params.get('lang') || 'en'
      const L = (en, pl) => (lang === 'pl' ? pl : en)

      const THEMES = {
        rose: [
          '#140a10',
          '#1c0f17',
          '#27141f',
          '#3b2031',
          '#f3dce8',
          '#a88798',
          '#f472b6',
          '#22040f'
        ],
        ocean: [
          '#07111c',
          '#0c1826',
          '#112031',
          '#1b2d42',
          '#d0e1f2',
          '#7f97b0',
          '#38bdf8',
          '#031018'
        ],
        ember: [
          '#120c09',
          '#1a120d',
          '#241913',
          '#36261c',
          '#f0e0d4',
          '#a48d7e',
          '#fb923c',
          '#1a0a02'
        ],
        nebula: [
          '#0d0b16',
          '#141022',
          '#1b1630',
          '#2a2343',
          '#ded7f4',
          '#9187b3',
          '#a78bfa',
          '#120a24'
        ]
      }
      function theme(id) {
        const [bg, surface, raised, border, text, muted, accent, ink] = THEMES[id]
        Object.entries({
          bg,
          surface,
          raised,
          border,
          text,
          muted,
          accent,
          ink,
          warn: '#f5cd47'
        }).forEach(([k, v]) => document.documentElement.style.setProperty(`--${k}`, v))
      }
      const PEOPLE = {
        me: { name: L('Maya', 'Ola'), color: '#e879f9' },
        sam: { name: L('Sam', 'Kuba'), color: '#f59e0b' },
        priya: { name: L('Priya', 'Zosia'), color: '#10b981' },
        bot: { name: 'Enricher', color: '#6366f1' }
      }
      const av = (who, cls = '') =>
        `<span class="av ${cls}" style="background:${PEOPLE[who].color}">${PEOPLE[who].name[0]}</span>`
      const statusBar = `<div class="status"><span>9:41</span><span class="sys"><i style="width:17px;height:10px"></i><i style="width:15px;height:10px;border-radius:5px"></i><i style="width:24px;height:11px;border-radius:3px"></i></span></div>`
      const header = (title, bell = 2) =>
        `<div class="top"><h1>${title}</h1><span class="pill accent">${ic('bell')} ${bell}</span><span class="pill">${av('me')} @${PEOPLE.me.name}</span></div>`
      const online = (html, id = 'online') => `<div class="online" id="${id}">${html}</div>`
      const onlineIdle = (who) =>
        `<span class="stack">${who.map((w) => av(w)).join('')}</span><span class="dot"></span><span>${
          who.length === 1
            ? L(`${PEOPLE[who[0]].name} is online`, `${PEOPLE[who[0]].name} jest online`)
            : L(`${who.length} online now`, `${who.length} osoby online`)
        }</span>`
      const toolbar = (first = L('Board', 'Tablica')) =>
        `<div class="toolbar"><span class="pill filled">${ic(first === L('Board', 'Tablica') ? 'columns-3' : 'list-checks')} ${first}</span><span class="pill">${ic('filter')} ${L('Filter', 'Filtr')}</span><span class="pill">${ic('ellipsis')} ${L('More', 'Więcej')}</span></div>`
      const photo = (name) => `photos/${name}.webp`
      const spin = '<span class="spin"></span>'
      // Paused animations; the renderer drives currentTime.
      const anim = (el, frames, opts) => {
        const a = (typeof el === 'string' ? document.querySelector(el) : el).animate(frames, {
          fill: 'both',
          easing: 'cubic-bezier(0.23, 1, 0.32, 1)',
          ...opts
        })
        a.pause()

          offset: Math.min(1, Math.max(0, t / total))

        if (frames[0].offset > 0) frames.unshift({ ...steps[0][1], offset: 0 })
        if (frames[frames.length - 1].offset < 1)

              due: L('Sat', 'sob.'),
              who: ['sam']
            }
          ]
        },
        {
          name: L('Done', 'Gotowe'),
          cards: [{ t: L('Name the game', 'Wymyślić nazwę'), who: ['sam'] }]
        }
      ]

      scenes.game = () => {
        kanban(
          'ember',
          L('Night Market', 'Nocny Targ'),
          3,
          L(
            'A trading card game for 2–4. Playtest every Sunday.',
            'Gra karciana w handel dla 2–4 osób. Testy w niedzielę.'
          ),
          ['sam', 'priya'],
          GAME(),
          Number(params.get('x') || 0)
        )
        if (params.get('anim') !== '1') return
        // Drag "Print a prototype deck" from Playtesting to Done.
        const T = 3600
        // The board scrolls to Playtesting, then follows the drag (auto-scroll) so
        // Done slides in under the card.
        timeline('#cols', T, [
          [300, { transform: 'translateX(-302px)', easing: 'cubic-bezier(0.32, 0.72, 0, 1)' }],
          [1000, { transform: 'translateX(-604px)' }],
          [1420, { transform: 'translateX(-604px)', easing: 'cubic-bezier(0.77, 0, 0.175, 1)' }],
          [2320, { transform: 'translateX(-906px)' }]
        ])
        const card = document.getElementById('print')
        card.style.zIndex = 5
        timeline(card, T, [
          [
            1200,
            { transform: 'translate(0, 0) scale(1) rotate(0)', boxShadow: '0 0 0 rgba(0,0,0,0)' }
          ],
          [
            1420,
            {
              transform: 'translate(0, 0) scale(1.04) rotate(-1.5deg)',
              boxShadow: '0 18px 40px rgba(0,0,0,.55)',
              easing: 'cubic-bezier(0.77, 0, 0.175, 1)'
            }
          ],
          [
            2320,
            {
              transform: 'translate(302px, 78px) scale(1.04) rotate(1deg)',
              boxShadow: '0 18px 40px rgba(0,0,0,.55)'
            }
          ],
          [
            2560,
            {
              transform: 'translate(302px, 78px) scale(1) rotate(0)',
              boxShadow: '0 0 0 rgba(0,0,0,0)'
            }
          ]
        ])
        window.sceneDuration = 3600
      }

      scenes.app = () => {
        kanban(
          'nebula',
          L('Habit app', 'Aplikacja nawyków'),
          1,
          L(
            'Side project: a tiny habit tracker. Ship v1 before December.',
            'Projekt po godzinach: mały tracker nawyków. Wersja 1 przed grudniem.'
          ),
          ['priya', 'bot'],
          [
            {
              name: L('Building', 'W budowie'),
              cards: [
                {
                  t: L('Onboarding: three screens', 'Onboarding: trzy ekrany'),
                  labels: [[L('design', 'projekt'), '#a78bfa']],
                  prog: 33,
                  items: '1/3',
                  c: 3,
                  who: ['me']
                },
                {
                  t: L('Streak summary every Sunday', 'Podsumowanie serii w niedzielę'),
                  labels: [[L('feature', 'funkcja'), '#34d399']],
                  c: 1,
                  who: ['bot']
                }
              ]
            },
            {
              name: L('Review', 'Do sprawdzenia'),
              cards: [
                {
                  t: L('Reminders fire twice after reboot', 'Przypomnienia dwa razy po restarcie'),
                  labels: [[L('bug', 'błąd'), '#f87171']],
                  pts: 2,
                  c: 2,
                  who: ['priya']
                }
              ]
            },
            {
              name: L('Shipped', 'Wydane'),
              cards: [
                {
                  t: L('Daily check-in widget', 'Widżet codziennego meldunku'),
                  labels: [[L('feature', 'funkcja'), '#34d399']],
                  who: ['me']
                }
              ]
            }
          ]
        )
      }

      scenes.chat = () => {
        theme('nebula')
        const msgs = [
          [
            'priya',
            L('9:02', '9:02'),
            L(
              'Reminders still fire twice for me after a reboot.',
              'U mnie przypomnienia dalej przychodzą dwa razy po restarcie.'
            )
          ],
          [
            'me',
            L('9:05', '9:05'),
            L(
              '@Enricher can you check the iOS docs for that?',
              '@Enricher możesz sprawdzić to w dokumentacji iOS?'
            )
          ],
          [
            'bot',
            L('9:06', '9:06'),
            L(
              'Found it: notifications scheduled before a reboot are restored by the system. Clear pending ones on launch. I added the steps to the bug card.',
              'Znalazłem: system przywraca powiadomienia zaplanowane przed restartem. Wyczyść oczekujące przy starcie. Dopisałem kroki do karty z błędem.'
            ),
            true
          ],
          [
            'priya',
            L('9:08', '9:08'),
            L(
              'That was it. Fixed, moving it to Review.',
              'To było to. Naprawione, przenoszę do sprawdzenia.'
            )
          ]
        ]
        document.body.innerHTML = `${statusBar}<div class="screen">
          <div class="top"><h1 style="font-size:22px">${L('Chat', 'Czat')}</h1><span style="color:var(--muted)">${ic('x', 22)}</span></div>
          <div class="desc" style="margin-bottom:22px">${L('Habit app · everyone on this board', 'Aplikacja nawyków · wszyscy na tablicy')}</div>
          ${msgs
            .map(
              ([w, time, text, isBot]) =>
                `<div class="msg">${av(w, 'big')}<div><div class="n" style="color:${PEOPLE[w].color}">${PEOPLE[w].name}${isBot ? `<span class="agent">${L('AGENT', 'AGENT')}</span>` : ''}<small>${time}</small></div><div class="b">${text.replace(/@Enricher/, '<b style="color:var(--accent)">@Enricher</b>')}</div></div></div>`
            )
            .join('')}
        </div><div class="composer"><div class="in">${L('Message the board', 'Napisz do tablicy')}</div><div class="send" style="display:flex;align-items:center;justify-content:center;color:var(--ink)">${ic('send', 18)}</div></div>`
      }

      scenes[scene]()
      document.documentElement.setAttribute('data-ready', '1')
    </script>
  </body>
</html>
