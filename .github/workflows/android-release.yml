name: Android Release

# Builds the Android app as a signed arm64 APK and attaches it to a draft GitHub
# release `android-v<version>` (never plain `v*`: those trigger the npm publish in
# publish.yml). The version comes from apps/mobile/app.json. Manual only: the
# release tag is created when a draft is published, often one drafted by the
# local `release:android`, and a tag trigger would then build it a second time.

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Read version
        id: version
        run: |
          version=$(jq -r '.expo.version' app.json)
          code=$(jq -r '.expo.android.versionCode' app.json)
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "android-v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Install
        working-directory: .
        run: npm ci --ignore-scripts

      # android/ is generated; the android-release config plugin sets minSdk and
      # release signing. The worker bundle is the committed src/worker.bundle.js.
      - name: Prebuild
        run: npx expo prebuild --platform android --clean --no-install

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; refusing to ship a debug-signed APK"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      # The bundled Bare backend is built for android-arm64 only.
      - name: Build APK
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Collect APK
        id: apk
        run: |
          name="OpenCollab-${{ steps.version.outputs.version }}-arm64.apk"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256")
          rm -f "$RUNNER_TEMP/release.jks"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-v${{ steps.version.outputs.version }}"
          gh release create "$tag" dist/* \
            --draft \
            --target "$GITHUB_SHA" \
            --title "OpenCollab for Android ${{ steps.version.outputs.version }}" \
            --notes "Android APK for arm64 phones, Android 10 or newer (version code ${{ steps.version.outputs.code }}). Open the APK on your phone and allow installing apps from your browser when asked."
